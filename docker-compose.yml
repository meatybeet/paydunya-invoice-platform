services:
  mongo:
    image: mongo:7.0
    container_name: paydunya-invoice-mongo
    ports:
      - "27017:27017"
    volumes:
      - paydunya_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  paydunya_mongo_data:
