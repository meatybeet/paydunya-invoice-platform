<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Facture PayDunya : consultez, imprimez et telechargez votre facture a tout moment depuis ce lien permanent.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)">
  <title>Facture · PayDunya</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif']
          },
          animation: {
            'fade-in': 'fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
            'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
            'float': 'float 6s ease-in-out infinite',
            'pulse-subtle': 'pulseSubtle 2s ease-in-out infinite'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'scale(0.97)' },
              '100%': { opacity: '1', transform: 'scale(1)' }
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(12px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-6px)' }
            },
            pulseSubtle: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.85', transform: 'scale(0.995)' }
            }
          }
        }
      }
    }
  </script>

  <script>
    // Apply the stored theme before first paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (err) {
        /* storage blocked - fall back to the light theme */
      }
    })();
  </script>

  <link rel="stylesheet" href="styles.css">

  <style>
    /* Invoice-page helpers only. Everything else comes from styles.css and Tailwind. */

    /* The customer prints this page as a paper invoice: strip the site chrome,
       force a white sheet and keep each block on a single page. The dark theme
       is removed by the view before the job starts, so colours stay printable. */
    @page {
      margin: 14mm;
    }

    @media print {
      body > header,
      body > footer,
      #skip-to-content,
      #toast-container,
      .noise-overlay,
      [data-print="hide"] {
        display: none !important;
      }

      html,
      body {
        background: #ffffff !important;
      }

      .receipt-shell {
        max-width: none !important;
        padding: 0 !important;
      }

      .receipt-shell section {
        box-shadow: none !important;
        break-inside: avoid;
      }

      a[href]::after {
        content: "" !important;
      }
    }
  </style>
</head>

<body class="bg-[#fafaf9] text-stone-900 dark:bg-[#0c0a09] dark:text-stone-100 font-sans antialiased min-h-screen flex flex-col transition-colors duration-300">

  <div class="noise-overlay"></div>

  <a id="skip-to-content" href="#receipt-view"
     class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[70] focus:rounded-xl focus:bg-cyan-600 focus:px-4 focus:py-2.5 focus:text-sm focus:font-semibold focus:text-white">
    Aller à la facture
  </a>

  <!-- Slim public header: brand on the left, appearance toggle on the right. -->
  <header class="sticky top-0 z-40 border-b border-stone-200/70 dark:border-stone-800/70 bg-[#fafaf9]/85 dark:bg-[#0c0a09]/85 backdrop-blur-xl">
    <div class="mx-auto w-full max-w-4xl px-4 sm:px-6 lg:px-8 h-14 sm:h-16 flex items-center justify-between gap-3">

      <div class="flex items-center gap-2.5 min-w-0">
        <div class="h-9 w-9 shrink-0 rounded-xl bg-cyan-600 text-white flex items-center justify-center shadow-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25M9 16.5v.75m3-3v3M15 12v5.25m-4.5-15H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
          </svg>
        </div>
        <div class="min-w-0">
          <p class="text-sm font-extrabold tracking-tight leading-tight truncate">PayDunya</p>
          <p class="text-[10px] font-bold uppercase tracking-widest text-stone-400 dark:text-stone-500">Facture</p>
        </div>
      </div>

      <button id="theme-toggle" type="button"
              aria-label="Basculer entre le thème clair et le thème sombre"
              class="inline-flex items-center justify-center h-9 w-9 shrink-0 rounded-xl border border-stone-200 dark:border-stone-800 bg-white dark:bg-stone-900 text-stone-500 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-100 hover:bg-stone-50 dark:hover:bg-stone-800/60 shadow-sm transition-all active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-offset-[#fafaf9] dark:focus-visible:ring-offset-[#0c0a09] focus-visible:ring-stone-400">
        <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/>
        </svg>
        <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>
        </svg>
      </button>

    </div>
  </header>

  <!-- The view fills this outlet. -->
  <main id="receipt-view" class="flex-1" tabindex="-1"></main>

  <footer class="border-t border-stone-200/70 dark:border-stone-800/70 mt-12">
    <div class="mx-auto w-full max-w-4xl px-4 sm:px-6 lg:px-8 py-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <p class="text-xs text-stone-500 dark:text-stone-400 leading-relaxed max-w-md">
        Conservez le lien de cette page : il vous permet de retrouver votre facture à tout moment.
      </p>
      <p class="text-xs font-semibold text-stone-400 dark:text-stone-500 shrink-0">
        Propulsé par PayDunya
      </p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/receipt.js"></script>
</body>
</html>
