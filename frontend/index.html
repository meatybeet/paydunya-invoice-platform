    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif']
          },
          animation: {
            'fade-in': 'fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
            'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
            'float': 'float 6s ease-in-out infinite',
            'pulse-subtle': 'pulseSubtle 2s ease-in-out infinite'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'scale(0.97)' },
              '100%': { opacity: '1', transform: 'scale(1)' }
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(12px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-6px)' }
            },
            pulseSubtle: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.85', transform: 'scale(0.995)' }
            }
          }
        }
      }
    }
  </script>

  <script>
    // Apply the stored theme before first paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (err) {
        /* storage blocked - fall back to the light theme */
      }
    })();
  </script>

  <!-- Bootstrap -->
  <script>
    (function () {
      'use strict';

      var shell = document.getElementById('app-shell');
      var authOutlet = document.getElementById('auth-outlet');
      var adminGroup = document.getElementById('nav-admin-group');
      var usersTab = document.getElementById('nav-users-tab');
      var routerStarted = false;
      var mode = null;

      function syncChrome() {
        var user = App.session.currentUser() || {};
        var name = user.name || '—';
        document.getElementById('user-avatar').textContent = App.ui.initials(user.name);
        document.getElementById('user-name').textContent = name;
        document.getElementById('user-role').innerHTML = user.role ? App.ui.roleBadge(user.role) : '';

        var isAdmin = App.session.isSuperAdmin();
        adminGroup.classList.toggle('hidden', !isAdmin);
        usersTab.classList.toggle('hidden', !isAdmin);
        usersTab.classList.toggle('flex', isAdmin);
      }

      function showLogin() {
        mode = 'login';
        shell.classList.add('hidden');
        authOutlet.classList.remove('hidden');
        authOutlet.innerHTML = '';
        var view = App.views.login;
        if (view && typeof view.render === 'function') {
          view.render(authOutlet, {});
        } else {
          App.ui.mount(
            authOutlet,
            App.ui.el('div', { class: 'min-h-screen flex items-center justify-center px-4' }, [
              App.ui.errorState({
                title: 'Écran de connexion indisponible',
                message: 'Le module de connexion n’a pas pu être chargé. Rechargez la page.',
                onRetry: function () { window.location.reload(); }
              })
            ])
          );
        }
      }

      function showApp() {
        mode = 'app';
        authOutlet.classList.add('hidden');
        authOutlet.innerHTML = '';
        shell.classList.remove('hidden');
        syncChrome();
        if (routerStarted) {
          App.router.refresh();
        } else {
          routerStarted = true;
          App.router.start();
        }
        checkApiStatus();
        // Refresh the cached profile; a revoked token drops us back to login.
        App.api.me().then(function (user) {
          if (user) App.session.setUser(user);
        }, function () { /* handled by the session listener */ });
      }

      function checkApiStatus() {
        var node = document.getElementById('api-status');
        if (!node) return;
        App.api.health().then(
          function () {
            node.innerHTML =
              '<span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>Serveur connecté';
            node.className =
              'flex items-center gap-2 text-[11px] font-semibold text-stone-400 dark:text-stone-500';
          },
          function () {
            node.innerHTML =
              '<span class="h-1.5 w-1.5 rounded-full bg-rose-500 animate-pulse-subtle"></span>Serveur injoignable';
            node.className =
              'flex items-center gap-2 text-[11px] font-semibold text-rose-500 dark:text-rose-400';
          }
        );
      }

      function boot() {
        if (App.session.isAuthenticated()) showApp();
        else showLogin();
      }

      App.session.onChange(function () {
        var authenticated = App.session.isAuthenticated();
        if (authenticated && mode !== 'app') showApp();
        else if (!authenticated && mode !== 'login') showLogin();
        else if (authenticated) syncChrome();
      });

      document.getElementById('skip-to-content').addEventListener('click', function () {
        var main = document.getElementById('view');
        if (main) main.focus();
      });

      document.getElementById('theme-toggle').addEventListener('click', function () {
        App.ui.theme.toggle();
      });

      document.getElementById('logout-button').addEventListener('click', function () {
        App.session.logout();
        App.ui.toast({ message: 'Vous avez été déconnecté.', type: 'info' });
      });

      // Follow the system theme while the user has not made an explicit choice.
      if (window.matchMedia) {
        var query = window.matchMedia('(prefers-color-scheme: dark)');
        var onSchemeChange = function () {
          if (!App.ui.theme.stored()) App.ui.theme.apply();
        };
        if (query.addEventListener) query.addEventListener('change', onSchemeChange);
        else if (query.addListener) query.addListener(onSchemeChange);
      }

      boot();
    })();
  </script>
</body>
</html>
